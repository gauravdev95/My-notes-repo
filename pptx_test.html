<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #fafaf9; color: #1c1917; margin: 0; padding: 12px; }
  #content { max-width: 1000px; margin: 0 auto; }
  h2 { font-size: 18px; margin: 18px 0 8px; }
  table { border-collapse: collapse; margin-bottom: 18px; display: block; overflow-x: auto; }
  td, th { border: 1px solid #d6d3d1; padding: 6px 10px; font-size: 14px; white-space: nowrap; }
  th { background: #f5f5f4; }
  p { line-height: 1.6; }
  #content img { max-width: 100%; height: auto; }
  .docx table { display: table; width: 100%; }
  .docx td, .docx th { white-space: normal; }
  @media (max-width: 600px) {
    td, th { font-size: 12px; padding: 4px 6px; }
    body { padding: 8px; }
  }
  .sheet-fit { position: relative; width: 100%; overflow: hidden; }
  .slide-wrap { margin: 20px 0; }
  .pptx-nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: center; gap: 16px; padding: 10px; background: #1c1917; z-index: 10; }
  .pptx-nav button { background: #292524; color: #fafaf9; border: none; padding: 10px 22px; font-size: 15px; border-radius: 4px; }
  .pptx-nav span { color: #fafaf9; font-size: 15px; }
  #content.pptx-mode .slide-wrap { display: flex; flex-direction: column; justify-content: center; min-height: calc(100vh - 130px); }
  .slide-label { text-align: center; color: #78716c; font-size: 13px; margin-bottom: 6px; }
  .slide-box { position: relative; width: 100%; overflow: hidden; }
  .slide { position: absolute; left: 0; top: 0; transform-origin: top left; background: #fff; box-shadow: 0 2px 14px rgba(0,0,0,.25); overflow: hidden; }
  .shape { position: absolute; overflow: hidden; }
  .slide img { position: absolute; }
  #loading { text-align: center; color: #78716c; padding: 40px 10px; font-size: 15px; }
</style>

<script>
(function () {
  var content = document.getElementById('content');

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function b64ToBuffer(b64) {
    var s = atob(b64), buf = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) buf[i] = s.charCodeAt(i);
    return buf;
  }
  // XML helpers (namespace-safe via localName)
  function kids(el, name) {
    var r = [];
    if (!el) return r;
    for (var i = 0; i < el.childNodes.length; i++) {
      var c = el.childNodes[i];
      if (c.nodeType === 1 && c.localName === name) r.push(c);
    }
    return r;
  }
  function first(el, name) {
    var k = kids(el, name);
    return k.length ? k[0] : null;
  }
  function attr(el, name) {
    if (!el) return null;
    for (var i = 0; i < el.attributes.length; i++) {
      if (el.attributes[i].localName === name) return el.attributes[i].value;
    }
    return null;
  }
  function parseXml(text) {
    return new DOMParser().parseFromString(text, 'text/xml');
  }
  function emuToPx(emu, scale) {
    return (parseInt(emu || '0', 10) / 914400 * 96) * scale;
  }

  // ---------------- DOCX ----------------
  async function renderDocx(buf) {
    var res = await mammoth.convertToHtml({ arrayBuffer: buf.buffer });
    content.innerHTML = '<div class="docx">' + (res.value || '<p>(Empty document)</p>') + '</div>';
  }

  // ---------------- XLSX ----------------
  function renderXlsx(buf) {
    var wb = XLSX.read(buf, { type: 'array' });
    var html = '';
    wb.SheetNames.forEach(function (n) {
      html += '<h2>' + esc(n) + '</h2><div class="sheet-fit">'
        + XLSX.utils.sheet_to_html(wb.Sheets[n]) + '</div>';
    });
    content.innerHTML = html || '<p>(Empty spreadsheet)</p>';
    fitTables();
  }

  // Scale sheets down to fit the screen width — but never so small that the
  // text becomes unreadable. Below that point the sheet stays at natural size
  // and scrolls sideways (like Google Sheets on a phone).
  function fitTables() {
    var wraps = document.querySelectorAll('.sheet-fit');
    for (var i = 0; i < wraps.length; i++) {
      var t = wraps[i].querySelector('table');
      if (!t) continue;
      t.style.transform = '';
      wraps[i].style.height = '';
      var cw = t.clientWidth, sw = t.scrollWidth;
      if (sw > cw) {
        var s = cw / sw;
        if (s < 0.7) continue; // too wide to shrink: keep readable + scroll
        t.style.transform = 'scale(' + s + ')';
        t.style.transformOrigin = 'top left';
        wraps[i].style.height = (t.offsetHeight * s) + 'px';
      }
    }
  }

  // ---------------- PPTX ----------------
  function relMapOf(doc) {
    var map = {};
    var rels = doc.getElementsByTagNameNS('*', 'Relationship');
    for (var i = 0; i < rels.length; i++) {
      map[attr(rels[i], 'Id')] = attr(rels[i], 'Target');
    }
    return map;
  }

  function renderShape(sp, ox, oy, scale) {
    var spPr = first(sp, 'spPr');
    var xfrm = spPr ? first(spPr, 'xfrm') : null;
    var off = xfrm ? first(xfrm, 'off') : null;
    var ext = xfrm ? first(xfrm, 'ext') : null;
    var x = (off ? parseInt(attr(off, 'x') || '0', 10) : 0) + ox;
    var y = (off ? parseInt(attr(off, 'y') || '0', 10) : 0) + oy;
    var cx = ext ? parseInt(attr(ext, 'cx') || '0', 10) : 0;
    var cy = ext ? parseInt(attr(ext, 'cy') || '0', 10) : 0;
    var txBody = first(sp, 'txBody');
    if (!txBody) return '';
    var paras = kids(txBody, 'p').map(function (p) {
      var pPr = first(p, 'pPr');
      var algn = pPr ? (attr(pPr, 'algn') || 'l') : 'l';
      var alignMap = { l: 'left', ctr: 'center', r: 'right', just: 'justify' };
      var runs = kids(p, 'r').map(function (r) {
        var rPr = first(r, 'rPr');
        var sz = rPr ? parseInt(attr(rPr, 'sz') || '1800', 10) : 1800;
        var b = rPr && attr(rPr, 'b') === '1';
        var it = rPr && attr(rPr, 'i') === '1';
        var color = '';
        var fill = rPr ? first(rPr, 'solidFill') : null;
        if (fill) {
          var c = first(fill, 'srgbClr');
          if (c) color = '#' + attr(c, 'val');
        }
        var t = first(r, 't');
        var text = t ? t.textContent : '';
        return '<span style="font-size:' + (sz / 100 * scale) + 'px;'
          + (b ? 'font-weight:bold;' : '') + (it ? 'font-style:italic;' : '')
          + (color ? 'color:' + color + ';' : '') + '">' + esc(text) + '</span>';
      }).join('');
      return '<div style="text-align:' + (alignMap[algn] || 'left') + ';line-height:1.35;">' + runs + '</div>';
    }).join('');
    return '<div class="shape" style="left:' + emuToPx(x, scale) + 'px;top:' + emuToPx(y, scale)
      + 'px;width:' + emuToPx(cx, scale) + 'px;height:' + emuToPx(cy, scale) + 'px;">' + paras + '</div>';
  }

  async function renderPic(zip, pic, slideRels, ox, oy, scale) {
    var blipFill = first(pic, 'blipFill');
    var blip = blipFill ? first(blipFill, 'blip') : null;
    var rid = blip ? attr(blip, 'embed') : null;
    var target = rid ? slideRels[rid] : null;
    if (!target) return '';
    var path = 'ppt/media/' + target.split('/').pop();
    var file = zip.file(path);
    if (!file) return '';
    var ext = path.split('.').pop().toLowerCase();
    var mime = ext === 'png' ? 'image/png' : (ext === 'jpg' || ext === 'jpeg') ? 'image/jpeg' : ext === 'gif' ? 'image/gif' : 'image/png';
    var b64 = await file.async('base64');
    var spPr = first(pic, 'spPr');
    var xfrm = spPr ? first(spPr, 'xfrm') : null;
    var off = xfrm ? first(xfrm, 'off') : null;
    var extEl = xfrm ? first(xfrm, 'ext') : null;
    var x = (off ? parseInt(attr(off, 'x') || '0', 10) : 0) + ox;
    var y = (off ? parseInt(attr(off, 'y') || '0', 10) : 0) + oy;
    var cx = extEl ? parseInt(attr(extEl, 'cx') || '0', 10) : 0;
    var cy = extEl ? parseInt(attr(extEl, 'cy') || '0', 10) : 0;
    return '<img src="data:' + mime + ';base64,' + b64 + '" style="left:' + emuToPx(x, scale)
      + 'px;top:' + emuToPx(y, scale) + 'px;width:' + emuToPx(cx, scale)
      + 'px;height:' + emuToPx(cy, scale) + 'px;">';
  }

  async function walkTree(zip, node, slideRels, ox, oy, scale) {
    var html = '';
    for (var i = 0; i < node.childNodes.length; i++) {
      var ch = node.childNodes[i];
      if (ch.nodeType !== 1) continue;
      var ln = ch.localName;
      if (ln === 'sp') {
        html += renderShape(ch, ox, oy, scale);
      } else if (ln === 'pic') {
        html += await renderPic(zip, ch, slideRels, ox, oy, scale);
      } else if (ln === 'grpSp') {
        var gPr = first(ch, 'grpSpPr');
        var xfrm = gPr ? first(gPr, 'xfrm') : null;
        var off = xfrm ? first(xfrm, 'off') : null;
        var gx = off ? parseInt(attr(off, 'x') || '0', 10) : 0;
        var gy = off ? parseInt(attr(off, 'y') || '0', 10) : 0;
        html += await walkTree(zip, ch, slideRels, ox + gx, oy + gy, scale);
      } else if (ln === 'graphicFrame') {
        var texts = [];
        var tNodes = ch.getElementsByTagNameNS('*', 't');
        for (var j = 0; j < tNodes.length; j++) texts.push(tNodes[j].textContent);
        if (texts.length) {
          var spPr = first(ch, 'xfrm') ? null : null;
          html += '<div style="margin:8px 0;font-size:' + (16 * scale) + 'px;">' + esc(texts.join(' ')) + '</div>';
        }
      }
    }
    return html;
  }

  async function renderPptx(buf) {
    var zip = await JSZip.loadAsync(buf);
    var presDoc = parseXml(await zip.file('ppt/presentation.xml').async('text'));
    var presRels = relMapOf(parseXml(await zip.file('ppt/_rels/presentation.xml.rels').async('text')));
    var sldSz = presDoc.getElementsByTagNameNS('*', 'sldSz')[0];
    var emuW = parseInt(attr(sldSz, 'cx') || '12192000', 10);
    var emuH = parseInt(attr(sldSz, 'cy') || '6858000', 10);
    var scale = 960 / (emuW / 914400 * 96);
    var slideW = emuToPx(emuW, scale);
    var slideH = emuToPx(emuH, scale);

    var slidePaths = [];
    var sldIds = presDoc.getElementsByTagNameNS('*', 'sldId');
    for (var i = 0; i < sldIds.length; i++) {
      var target = presRels[attr(sldIds[i], 'id')];
      if (target) slidePaths.push('ppt/' + target.replace(/^\//, ''));
    }
    if (!slidePaths.length) {
      // fallback: any slide xml found in the zip
      zip.forEach(function (p) {
        if (/^ppt\/slides\/slide\d+\.xml$/.test(p)) slidePaths.push(p);
      });
      slidePaths.sort();
    }

    var out = '';
    for (var si = 0; si < slidePaths.length; si++) {
      var slideFile = zip.file(slidePaths[si]);
      if (!slideFile) continue;
      var sDoc = parseXml(await slideFile.async('text'));
      var relPath = slidePaths[si].replace('ppt/slides/', 'ppt/slides/_rels/') + '.rels';
      var slideRels = {};
      var relFile = zip.file(relPath);
      if (relFile) slideRels = relMapOf(parseXml(await relFile.async('text')));
      var bgColor = '#ffffff';
      var bgs = sDoc.getElementsByTagNameNS('*', 'bg');
      if (bgs.length) {
        var srgb = bgs[0].getElementsByTagNameNS('*', 'srgbClr')[0];
        if (srgb) bgColor = '#' + attr(srgb, 'val');
      }
      var spTree = sDoc.getElementsByTagNameNS('*', 'spTree')[0];
      var body = spTree ? await walkTree(zip, spTree, slideRels, 0, 0, scale) : '';
      out += '<div class="slide-wrap"><div class="slide-label">Slide ' + (si + 1) + '</div>'
        + '<div class="slide-box"><div class="slide" style="width:' + slideW + 'px;height:' + slideH
        + 'px;background:' + bgColor + ';">' + body + '</div></div></div>';
    }
    content.innerHTML = out || '<p>(No slides found)</p>';
    fitSlides();
    // Presentation mode: one slide at a time, like the PDF viewer.
    var wraps = document.querySelectorAll('.slide-wrap');
    var total = wraps.length;
    if (total > 0) {
      content.classList.add('pptx-mode');
      document.body.style.paddingBottom = '60px';
      var nav = document.createElement('div');
      nav.className = 'pptx-nav';
      nav.innerHTML = '<button id="pptx-prev">PREV</button><span id="pptx-label"></span><button id="pptx-next">NEXT</button>';
      document.body.appendChild(nav);
      var label = document.getElementById('pptx-label');
      var prevBtn = document.getElementById('pptx-prev');
      var nextBtn = document.getElementById('pptx-next');
      var current = 0;
      function showSlide(i) {
        if (i < 0) i = 0;
        if (i > total - 1) i = total - 1;
        current = i;
        for (var j = 0; j < total; j++) wraps[j].style.display = (j === i) ? '' : 'none';
        label.textContent = 'Slide ' + (i + 1) + ' / ' + total;
        prevBtn.style.opacity = (i === 0) ? '0.4' : '1';
        nextBtn.style.opacity = (i === total - 1) ? '0.4' : '1';
        fitSlides();
        window.scrollTo(0, 0);
      }
      prevBtn.addEventListener('click', function () { showSlide(current - 1); });
      nextBtn.addEventListener('click', function () { showSlide(current + 1); });
      // Tap left half = previous slide, right half = next slide
      content.addEventListener('click', function (e) {
        if (e.clientX < window.innerWidth / 2) showSlide(current - 1);
        else showSlide(current + 1);
      });
      showSlide(0);
    }
  }

  // Scale every slide to fit the phone screen width exactly
  function fitSlides() {
    var boxes = document.querySelectorAll('.slide-box');
    for (var i = 0; i < boxes.length; i++) {
      var slide = boxes[i].querySelector('.slide');
      if (!slide) continue;
      var scale = boxes[i].clientWidth / slide.offsetWidth;
      slide.style.transform = 'scale(' + scale + ')';
      boxes[i].style.height = (slide.offsetHeight * scale) + 'px';
    }
  }
  window.addEventListener('resize', function () { fitSlides(); fitTables(); });

  async function init() {
    try {
      var type = FileBridge.getType();
      var b64 = FileBridge.getData();
      var buf = b64ToBuffer(b64);
      if (type === 'docx') await renderDocx(buf);
      else if (type === 'xlsx') await renderXlsx(buf);
      else if (type === 'pptx') await renderPptx(buf);
      else content.innerHTML = '<p>Unsupported type: ' + esc(type) + '</p>';
    } catch (e) {
      content.innerHTML = '<p>Could not open file: ' + esc(e && e.message ? e.message : e) + '</p>';
    }
  }
  init();
})();
</script>
</body>
